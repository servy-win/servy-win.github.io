# GitHub Actions workflow to run ESLint and Jest tests on every push to main
name: test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Allows manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Fetch full history so Codecov has commit messages, PR bases, and diff info
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          # Caching npm dependencies speeds up subsequent runs
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linting
        run: npm run lint

      - name: Run Tests
        run: npm run test:coverage
        env:
          # Required for Jest to support ES Modules (ESM)
          NODE_OPTIONS: --experimental-vm-modules

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/cobertura-coverage.xml
          fail_ci_if_error: true
